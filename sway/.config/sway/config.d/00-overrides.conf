# Drop-in overrides — files in this directory are loaded after the main config.
# Examples:
#   output eDP-1 scale 1.25
#   bindsym $mod+n exec my-personal-script

# Audio stack (PipeWire + WirePlumber + Pulse compatibility)
exec --no-startup-id pipewire
exec --no-startup-id wireplumber
exec --no-startup-id pipewire-pulse

# Bluetooth applet (optional; requires net-wireless/blueman)
# exec --no-startup-id blueman-applet
