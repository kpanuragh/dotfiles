# GENERATED by theme/apply.py — Nebula Bloom
# Replaces the catppuccin tmux plugin: colours AND window-status format.

set -g status-style "bg=#140610,fg=#F6E4EE"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Session name, magenta pill
set -g status-left "#[bg=#FF4D9D,fg=#140610,bold]  #S #[default] "

# Host + clock
set -g status-right "#[fg=#B0849C]#h #[fg=#45243B]│ #[fg=#FF9E6B]%H:%M #[fg=#B0849C]%d %b"

# Windows — flat highlight block (window name, then number), NOT the catppuccin
# plugin's rounded powerline capsules. Those separator glyphs are not
# reproduced here; this replacement is a plain coloured block.
set -g window-status-format "#[fg=#B0849C] #W #[fg=#45243B]#I "
set -g window-status-current-format "#[bg=#33192C,fg=#FF9E6B,bold] #W #[fg=#FF4D9D]#I "
set -g window-status-separator ""

# Panes
set -g pane-border-style "fg=#45243B"
set -g pane-active-border-style "fg=#FF4D9D"

# Messages and command prompt
set -g message-style "bg=#33192C,fg=#F6E4EE"
set -g message-command-style "bg=#33192C,fg=#F6E4EE"

# Copy mode
set -g mode-style "bg=#FF4D9D,fg=#140610"

# Activity
set -g window-status-activity-style "fg=#FFC978"
set -g window-status-bell-style "fg=#FF5C6E,bold"
