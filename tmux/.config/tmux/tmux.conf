# ~/.config/tmux/tmux.conf
# tmux 3.5a — Ctrl-Space prefix, vi copy-mode, Nebula Bloom theme, TPM plugins.

# ── Prefix ────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix          # Ctrl-Space Ctrl-Space -> literal Ctrl-Space

# ── Terminal / colors ─────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,*256col*:Tc"
set -ga terminal-features ",xterm-kitty:usstyle"   # undercurl for nvim diagnostics
set -g allow-passthrough on                        # OSC-52, image protocols
set -s escape-time 10                              # no lag on Esc in nvim
set -g focus-events on                             # nvim autoread/autosave

# ── General behaviour ─────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S / #W"
set -g display-time 2000
set -g status-interval 5
setw -g mode-keys vi
setw -g aggressive-resize on

# ── Splits & windows (inherit cwd) ────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"
# vim-tmux-navigator takes over root-table C-l, so route clear-screen via prefix
bind C-l send-keys 'C-l'
bind F resize-pane -Z                              # zoom (prefix f = tmux-fzf)

# Resize, repeatable (hold prefix once, tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode → Wayland clipboard ─────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
# Drag-select copies without snapping back to the prompt
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "wl-copy"
bind P run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# ── Plugins ───────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'

# resurrect: remember pane contents + restore nvim sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# continuum: autosave every 15 min, restore on server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @yank_selection_mouse 'clipboard'
TMUX_FZF_LAUNCH_KEY="f"

run '~/.config/tmux/plugins/tpm/tpm'

# ── Statusline (must come after the plugins load) ─────────────────────────
set -g status-position top

# Colours and status format are generated — see theme/palettes/nebula-bloom.toml
source-file ~/.config/tmux/theme.conf
