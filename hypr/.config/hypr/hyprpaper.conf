# hyprpaper — daemon-only config.
# v0.8.4 has a bug where `wallpaper =` directives are silently ignored, so we
# don't set them here. The wallpaper is loaded at startup by:
#   ~/.config/hypr/scripts/wallpaper-init.sh
# (Hyprland autostart). The switcher (Mod+Shift+W) also uses IPC, not this file.
ipc = on
splash = false
