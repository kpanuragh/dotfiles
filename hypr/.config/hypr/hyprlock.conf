# GENERATED by theme/apply.py — Nebula Bloom
$base     = rgb(140610)
$mantle   = rgb(0d0409)
$surface  = rgb(241020)
$text     = rgb(f6e4ee)
$accent   = rgb(ff4d9d)
$accent2  = rgb(ff9e6b)
$subtext  = rgb(c9a3b6)
$red      = rgb(ff5c6e)

general {
    hide_cursor = true
    # grace, no_fade_in, disable_loading_bar were removed in hyprlock 0.9.x.
    # grace is a CLI flag: launched as `hyprlock --grace 2` from hypridle.conf.
}

background {
    monitor =
    path    = ~/Pictures/Wallpapers/current
    blur_passes = 3
    blur_size   = 8
    contrast    = 0.9
    brightness  = 0.7
    vibrancy    = 0.24
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $text
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = $subtext
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size         = 0.25
    dots_spacing      = 0.4
    outer_color       = $accent
    inner_color       = rgba(241020aa)
    font_color        = $text
    fade_on_empty     = true
    placeholder_text  = <i>Password…</i>
    hide_input        = false
    rounding          = 16
    check_color       = $accent2
    fail_color        = $red
    fail_text         = <b>Wrong</b>
    position          = 0, -160
    halign            = center
    valign            = center
}
