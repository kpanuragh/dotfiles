# Kitty — Nord + JetBrainsMono Nerd Font (icons + ligatures in one font)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
adjust_line_height 110%
disable_ligatures cursor   # ligatures everywhere except where the cursor is

# Cursor
cursor_shape          beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 12.0

# Scrollback
scrollback_lines              100000
scrollback_pager              less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0

# Mouse
mouse_hide_wait        2.0
url_style              curly
open_url_with          default
detect_urls            yes
copy_on_select         clipboard
strip_trailing_spaces  smart
focus_follows_mouse    yes
pointer_shape_when_grabbed arrow
default_pointer_shape  beam

# Window
window_padding_width 12
window_margin_width  0
hide_window_decorations yes
background_opacity   1.0
dynamic_background_opacity yes
remember_window_size yes
initial_window_width  1200
initial_window_height 750
inactive_text_alpha   0.85
window_resize_step_cells   2
window_resize_step_lines   2
enabled_layouts       splits,stack,fat,tall,grid

# Tab bar
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"
tab_bar_min_tabs      2

# Bell
enable_audio_bell    no
visual_bell_duration 0.1
window_alert_on_bell yes
bell_on_tab          " "

# === Performance ===
sync_to_monitor   yes
repaint_delay     8
input_delay       1
wayland_titlebar_color background

# === Behaviour ===
confirm_os_window_close 0
# for kitty @ ... commands
allow_remote_control    yes
# allows scripts to control via $KITTY_LISTEN_ON
listen_on unix:@mykitty-{kitty_pid}

# === Keybindings ===
# Tabs
map ctrl+shift+t       new_tab_with_cwd
map ctrl+shift+w       close_tab
map ctrl+shift+]       next_tab
map ctrl+shift+[       previous_tab
map ctrl+shift+1       goto_tab 1
map ctrl+shift+2       goto_tab 2
map ctrl+shift+3       goto_tab 3
map ctrl+shift+4       goto_tab 4
map ctrl+shift+5       goto_tab 5
map ctrl+shift+,       move_tab_backward
map ctrl+shift+.       move_tab_forward

# Splits / windows
map ctrl+shift+enter   launch --location=hsplit --cwd=current
map ctrl+shift+\\      launch --location=vsplit --cwd=current
map ctrl+shift+|       launch --location=hsplit --cwd=current
map ctrl+shift+r       start_resizing_window
map ctrl+shift+f       toggle_fullscreen
map ctrl+shift+z       toggle_layout stack

# Vim-style window navigation
map ctrl+shift+h       neighboring_window left
map ctrl+shift+l       neighboring_window right
map ctrl+shift+k       neighboring_window up
map ctrl+shift+j       neighboring_window down

# Move windows
map ctrl+shift+alt+h   move_window left
map ctrl+shift+alt+l   move_window right
map ctrl+shift+alt+k   move_window up
map ctrl+shift+alt+j   move_window down

# Font size
map ctrl+shift+plus    change_font_size all +1.0
map ctrl+shift+equal   change_font_size all +1.0
map ctrl+shift+minus   change_font_size all -1.0
map ctrl+shift+0       change_font_size all 0

# Clipboard / scroll
map ctrl+shift+c       copy_to_clipboard
map ctrl+shift+v       paste_from_clipboard
map ctrl+shift+s       paste_from_selection
map ctrl+shift+u       kitten unicode_input
map ctrl+shift+f5      load_config_file
map ctrl+shift+f6      debug_config

# Hints (open URL in browser, copy URL, paste path, etc.)
map ctrl+shift+e       kitten hints
map ctrl+shift+p>f     kitten hints --type path --program -
map ctrl+shift+p>shift+f kitten hints --type path
map ctrl+shift+p>l     kitten hints --type line --program -
map ctrl+shift+p>w     kitten hints --type word --program -
map ctrl+shift+p>h     kitten hints --type hash --program -

# Search scrollback
map ctrl+shift+/       show_scrollback
map ctrl+shift+g       launch --type=overlay --stdin-source=@screen_scrollback fzf

# Colours are generated — see theme/palettes/nebula-bloom.toml
include theme.conf
